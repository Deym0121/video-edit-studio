<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fine-tune</title>
<style>
  @font-face{font-family:"Inter Tight";font-weight:600;src:url("/fonts/InterTight-wght-600.ttf")}
  @font-face{font-family:"Inter Tight";font-weight:800;src:url("/fonts/InterTight-wght-800.ttf")}
  @font-face{font-family:"Inter Tight";font-weight:900;src:url("/fonts/InterTight-wght-900.ttf")}
  :root{
    --bg:#121110;--panel:#191716;--panel2:#211E1C;--panel3:#2A2623;--line:#2F2A27;--line2:#3B3531;
    --text:#F2EDE8;--mut:#9A918A;--dim:#6E6660;--o:#FF6A00;--o2:#FF9A4D;--osoft:rgba(255,106,0,.12);
    --ok:#3FBF7F;--oksoft:rgba(63,191,127,.13);--bad:#FF5A4E;--badsoft:rgba(255,90,78,.13);--warn:#F2B544;
    --r:12px;--ui:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;--disp:"Inter Tight",var(--ui)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
  button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
  button:hover:not(:disabled){border-color:var(--o)}
  button:disabled{opacity:.38;cursor:default}
  button.primary{background:var(--o);border-color:var(--o);color:#1A0B04;font-weight:800}
  button.primary:hover:not(:disabled){background:var(--o2);border-color:var(--o2)}
  button.ghost{background:transparent;border-color:transparent;color:var(--mut)}
  button.ghost:hover:not(:disabled){color:var(--text);border-color:var(--line2)}
  button.sm{padding:4px 9px;font-size:12px;border-radius:8px}
  button.ok{border-color:rgba(63,191,127,.45);color:#8FE3B8}
  button.ok.on{background:var(--ok);border-color:var(--ok);color:#06140D;font-weight:800}
  button.no{border-color:rgba(255,90,78,.4);color:#FF9C94}
  .app{display:grid;grid-template-rows:56px 1fr auto;height:100vh}
  /* top */
  .top{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{display:flex;align-items:center;gap:9px;font:900 15px var(--disp);letter-spacing:-.01em;margin-right:4px}
  .logo i{width:26px;height:26px;border-radius:8px;background:var(--o);display:grid;place-items:center;color:#1A0B04;font-style:normal;font-size:13px}
  .logo span{color:var(--mut);font-weight:600}
  #proj{max-width:300px;background:var(--panel2);font-weight:600}
  .prog{display:flex;align-items:center;gap:10px;margin-left:6px;min-width:210px}
  .prog .bar{flex:1;height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--o2),var(--o));transition:width .3s}
  .prog .lbl{font:600 12px var(--ui);color:var(--mut);white-space:nowrap}
  .prog .lbl b{color:var(--text)}
  .grow{flex:1}
  .status{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
  .status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .status.busy:before{background:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  /* main grid */
  .mid{display:grid;grid-template-columns:370px 1fr 360px;min-height:0}
  .panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
  .panel.r{border-right:0;border-left:1px solid var(--line)}
  .phd{padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
  .phd h2{margin:0;font:800 15px var(--disp);letter-spacing:-.01em}
  .phd .sub{color:var(--mut);font-size:12px}
  .seg{display:flex;gap:4px;margin:0 12px 10px;padding:4px;background:var(--panel2);border-radius:11px}
  .seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:8px;font-weight:600;font-size:12.5px}
  .seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05)}
  .seg .n{display:inline-block;min-width:17px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--line);font-size:10.5px;color:var(--mut)}
  .seg .n.hot{background:var(--o);color:#1A0B04}
  .list{flex:1;overflow:auto;padding:4px 12px 16px}
  .toolrow{display:flex;gap:6px;align-items:center;margin:0 0 10px}
  .card{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);padding:11px 12px 11px 14px;margin-bottom:9px}
  .card:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--line2)}
  .card.approved:before{background:var(--ok)}
  .card.rejected:before,.card.restored:before{background:var(--bad)}
  .card.approved{opacity:.62}
  .card.focus{border-color:var(--o)}
  .card .meta{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:11.5px;margin-bottom:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:7px;font:700 10.5px var(--ui);letter-spacing:.04em;text-transform:uppercase;background:var(--panel3);color:var(--mut)}
  .chip.o{background:var(--osoft);color:var(--o2)}
  .chip.ok{background:var(--oksoft);color:#8FE3B8}
  .chip.bad{background:var(--badsoft);color:#FF9C94}
  .chip.warn{background:rgba(242,181,68,.13);color:#F5CB78}
  .tc{font:600 11.5px ui-monospace,Menlo,monospace;color:var(--text);cursor:pointer}
  .tc:hover{color:var(--o2)}
  .card .why{font-size:12.5px;color:var(--text);margin-bottom:6px}
  .card .rm{font-size:13px;line-height:1.5;color:#C9A9A2;text-decoration:line-through;text-decoration-color:rgba(255,90,78,.7);margin-bottom:9px;max-height:4.5em;overflow:hidden}
  .card .det{font-size:12px;color:var(--mut);margin-bottom:9px}
  .card .acts{display:flex;gap:6px;flex-wrap:wrap}
  .scard{display:grid;grid-template-columns:62px 1fr;gap:11px}
  .sthumb{width:62px;height:110px;border-radius:9px;background:#0B0A09;overflow:hidden;border:1px solid var(--line2);position:relative}
  .sthumb video{width:100%;height:100%;object-fit:cover;display:block}
  .sthumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:10px;text-align:center;padding:4px}
  .scard .lbl{font:800 13.5px var(--disp);letter-spacing:-.01em;margin-bottom:4px;line-height:1.25}
  .scard .src{font-size:11.5px;color:var(--mut);margin-bottom:8px}
  .sev{width:8px;height:8px;border-radius:50%;display:inline-block}
  .sev.s3{background:var(--bad)}.sev.s2{background:var(--warn)}.sev.s1{background:var(--mut)}
  .empty{color:var(--mut);padding:26px 14px;text-align:center;line-height:1.65;font-size:12.5px}
  .empty b{color:var(--text)}
  /* stage */
  .stage{display:flex;flex-direction:column;align-items:center;min-height:0;padding:12px 16px;gap:10px}
  .vtabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px}
  .vtabs button{border:0;background:transparent;color:var(--mut);padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px}
  .vtabs button.on{background:var(--panel3);color:var(--text)}
  .vtabs select{border:0;background:transparent;padding:6px 8px;color:var(--mut)}
  .vwrap{position:relative;flex:1;min-height:0;aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 1px var(--line)}
  .vwrap video{width:100%;height:100%;object-fit:contain;display:block}
  .vwrap .cap{position:absolute;left:5%;right:5%;top:62%;transform:translateY(-50%);text-align:center;font:800 clamp(14px,2.6vh,32px) var(--disp);letter-spacing:-.01em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);pointer-events:none;z-index:3}
  .vwrap .cap .kw{color:var(--o)}
  #gv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none;z-index:2}
  #vid{position:relative;z-index:1}
  #skb{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:0}
  #rv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;z-index:5;background:#000}
  .vwrap .gfx{position:absolute;z-index:4;left:10px;top:10px;background:rgba(255,106,0,.92);color:#1A0B04;font-weight:800;font-size:11px;padding:4px 9px;border-radius:7px;display:none}
  .vwrap .badge{position:absolute;z-index:6;right:10px;top:10px;padding:4px 9px;border-radius:7px;font:800 10.5px var(--ui);letter-spacing:.06em;background:rgba(18,17,16,.82);border:1px solid var(--line2);color:var(--mut)}
  .transport{display:flex;gap:10px;align-items:center}
  .transport .time{font:600 13px ui-monospace,Menlo,monospace;color:var(--mut);min-width:150px;text-align:center}
  .transport .time b{color:var(--text)}
  .play{width:46px;height:46px;border-radius:50%;background:var(--o);border:0;color:#1A0B04;font-size:16px;font-weight:900}
  .play:hover:not(:disabled){background:var(--o2)}
  /* transcript */
  .tx{padding:6px 18px 30px;font-size:15px;line-height:1.85;overflow:auto;flex:1;user-select:none}
  .tx span.w{cursor:pointer;border-radius:4px;padding:1px 1px}
  .tx span.w:hover{background:var(--panel3)}
  .tx span.w.now{background:var(--o);color:#1A0B04}
  .tx span.w.sel{background:rgba(255,154,77,.35)}
  .tx span.w.cut{color:#9C7A73;text-decoration:line-through;text-decoration-color:rgba(255,90,78,.75)}
  .tx span.w.fix{border-bottom:1px dashed var(--o2)}
  .tx .cutnote{display:inline-flex;align-items:center;gap:4px;margin:0 4px;padding:0 7px;border-radius:6px;background:var(--badsoft);color:#FF9C94;font:700 10.5px var(--ui);vertical-align:2px;cursor:pointer;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
  .tx .para{margin-bottom:12px}
  .legend{display:flex;gap:12px;padding:0 18px 8px;color:var(--mut);font-size:11.5px}
  .legend s{color:#9C7A73;text-decoration-color:rgba(255,90,78,.75)}
  .selbar{position:fixed;z-index:20;display:none;gap:6px;padding:6px;background:var(--panel3);border:1px solid var(--line2);border-radius:11px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  /* timeline */
  .tl{border-top:1px solid var(--line);background:var(--panel)}
  .tlbar{display:flex;gap:7px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
  .tlbar .hint{color:var(--mut);font-size:12px}
  .tlbar input[type=range]{width:140px;accent-color:var(--o)}
  .tlwrap{position:relative;display:flex}
  .labels{width:84px;flex:none;border-right:1px solid var(--line)}
  .labels div{display:flex;align-items:center;padding-left:12px;color:var(--mut);font-size:11.5px;font-weight:600}
  canvas{display:block;cursor:pointer}
  .hscroll{height:12px;margin-left:84px;position:relative;background:var(--panel2)}
  .hscroll i{position:absolute;top:3px;height:6px;border-radius:3px;background:var(--line2);cursor:grab}
  .toast{position:fixed;right:16px;top:66px;max-width:440px;background:var(--panel3);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:12.5px;display:none;box-shadow:0 14px 44px rgba(0,0,0,.55);z-index:30}
  .toast.show{display:block}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px;width:min(520px,92vw)}
  .modal input{width:100%;font:15px/1.4 var(--ui);padding:10px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);color:var(--text);margin:10px 0}
  .welcome h3{margin:0 0 10px;font:900 18px var(--disp)}
  .welcome li{margin:6px 0;line-height:1.55}
  kbd{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-size:11px}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
  @media (max-width:1250px){.mid{grid-template-columns:320px 1fr 300px}}
  @media (max-width:980px){.mid{grid-template-columns:1fr}.panel{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a href="/" style="text-decoration:none;color:inherit" title="Back to Studio"><div class="logo"><i id="lgI">S</i><b id="lgN" style="font-weight:inherit">Studio</b> <span>Fine-tune</span></div></a>
    <select id="proj" title="Piliin ang video"></select>
    <div class="prog" title="Ilan na ang na-approve mong parts at scenes"><div class="bar"><i id="progBar"></i></div><span class="lbl" id="progLbl">0/0 approved</span></div>
    <span class="grow"></span>
    <span class="status" id="status">Naka-save</span>
    <button class="ghost" id="undo" title="Undo (⌘Z)">↶</button>
    <button class="ghost" id="redo" title="Redo (⌘⇧Z)">↷</button>
    <button class="ghost" id="help" title="Paano gamitin">?</button>
    <button id="rPrev">Render preview</button>
    <button class="primary" id="rFinal">Export final</button>
  </div>

  <div class="mid">
    <aside class="panel">
      <div class="phd"><h2>Review</h2><span class="sub" id="revSub">i-approve isa-isa</span></div>
      <div class="seg" id="seg">
        <button data-tab="parts" class="on">Parts<span class="n" id="nParts">0</span></button>
        <button data-tab="scenes">Scenes<span class="n" id="nScenes">0</span></button>
        <button data-tab="issues">Issues<span class="n" id="nIssues">0</span></button>
        <button data-tab="flags">Flags<span class="n" id="nFlags">0</span></button>
      </div>
      <div class="list" id="listL"></div>
    </aside>

    <section class="stage">
      <div class="vtabs" id="vtabs"><button data-v="live" class="on">Live edit</button><button data-v="render">Rendered</button><select id="pvsel" title="Piliin ang preview"></select></div>
      <div class="vwrap"><canvas id="skb"></canvas><video id="vid" playsinline preload="auto"></video><video id="gv" muted playsinline preload="auto"></video>
        <video id="rv" playsinline controls preload="metadata"></video>
        <div class="cap" id="cap"></div><div class="gfx" id="gfx"></div><div class="badge" id="vbadge">LIVE EDIT</div></div>
      <div class="transport">
        <button class="ghost" id="back" title="-2s (←)">⏪</button>
        <button class="play" id="play" title="Space">▶</button>
        <button class="ghost" id="fwd" title="+2s (→)">⏩</button>
        <span class="time" id="time"><b>0:00.0</b> / 0:00.0</span>
        <button class="sm" id="mark" title="M — markahan ang mali dito">⚑ Flag (M)</button>
      </div>
    </section>

    <aside class="panel r">
      <div class="phd"><h2>Transcript</h2><span class="sub">lahat ng sinabi mo</span></div>
      <div class="legend"><span><s>naka-strike</s> = inalis</span><span>i-click = pakinggan</span><span>i-drag = pumili</span></div>
      <div class="tx" id="tx"></div>
    </aside>
  </div>

  <div class="tl">
    <div class="tlbar">
      <button class="sm" id="split" title="S">✂ Split</button>
      <button class="sm" id="del" title="Delete">Delete clip</button>
      <span class="hint" style="margin-left:6px">Pause</span>
      <select id="pause" class="sm" title="Haba ng pause sa pagitan ng mga linya (buong video)">
        <option value="0.15">Mabilis · 0.15s</option><option value="0.30">Normal · 0.30s</option>
        <option value="0.45">Natural · 0.45s</option><option value="0.60">Mabagal · 0.60s</option></select>
      <span class="hint">I-drag ang gilid ng clip para mag-trim · <kbd>Alt</kbd> = walang snap</span>
      <span class="grow"></span>
      <span class="hint">Zoom</span><input type="range" id="zoom" min="0" max="100" value="0">
    </div>
    <div class="tlwrap"><div class="labels" id="labels"></div><canvas id="cv"></canvas></div>
    <div class="hscroll" id="hs"><i id="hsk"></i></div>
  </div>
</div>
<div class="selbar" id="selbar"><button class="sm no" id="sbRm">✂ Tanggalin</button><button class="sm ok" id="sbRs">↺ Ibalik</button><button class="sm" id="sbCap">✎ Caption</button><button class="sm ghost" id="sbX">✕</button></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const vid = $("vid"), cv = $("cv"), ctx = cv.getContext("2d");
const TR = { ruler: 22, video: 70, caps: 28, gfx: 26 };
const TRH = TR.ruler + TR.video + TR.caps + TR.gfx;
const C = { bg: "#151311", clip: "#24201D", wave: "rgba(255,106,0,.8)", line: "rgba(255,255,255,.14)", o: "#FF6A00", mut: "#9A918A", cap: "#2A2623", capTx: "#E6DFD8", ok: "#3FBF7F", bad: "#FF5A4E" };
let P = null, segs = [], segOff = [], dur = 0, pieces = [], splits = [], selPiece = -1;
let pps = 10, view0 = 0, thumbs = null, caps = [], autoIssues = [], tab = "parts", vmode = "live";
let busy = false, poll = null, stopAt = null, srcMode = false, needFit = true, sel = null;

const tc = (t) => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, "0"); return `${m}:${s}`; };
const norm = (w) => (w || "").toLowerCase().replace(/[^\p{L}\p{N}']+/gu, "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (m, ms = 3500) => { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._t); if (ms) el._t = setTimeout(() => el.classList.remove("show"), ms); };
const wtext = (i) => (P.fixes[i] !== undefined ? P.fixes[i] : P.words[i].w);
async function api(path, body) { const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}); return r.json(); }
function setBusy(b, msg) { busy = b; $("status").textContent = b ? (msg || "Ina-apply…") : "Naka-save"; $("status").className = "status" + (b ? " busy" : ""); }
const rstate = (kind, key) => ((P.review || {})[kind] || {})[key]?.state || "open";

/* ---------------- projects ---------------- */
async function loadProjects() {
  const items = (await api("/api/projects")).sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
  $("proj").innerHTML = items.map((p) => `<option value="${p.name}">${esc(p.name.length > 14 ? p.name.slice(0, 8) + "…" : p.name)} · ${tc(p.dur)} → ${p.new_dur ? tc(p.new_dur) : "?"}${p.approved ? ` · ✓${p.approved}` : ""}</option>`).join("");
  let want = null; try { want = localStorage.getItem("proj"); } catch (e) {}
  if (want && items.some((p) => p.name === want)) $("proj").value = want;
  await open($("proj").value);
  let seen = null; try { seen = localStorage.getItem("seenHelp2"); } catch (e) {}
  if (!seen) showHelp();
}
$("proj").onchange = () => open($("proj").value);

async function open(name) {
  needFit = true; sel = null; hideSel();
  try { localStorage.setItem("proj", name); } catch (e) {}
  apply(await api(`/api/project/${name}`));
  waitProxy();
  if (P.job && P.job.state === "running") watch();
  if (P.qc && P.qc.state === "running") watchQC();
}

function apply(data) {
  P = data;
  segs = P.segments; segOff = []; let o = 0; segs.forEach((s) => { segOff.push(o); o += s[1] - s[0]; }); dur = o || P.new_dur || 0;
  splits = splits.filter((x) => segs.some((s) => x > s[0] + 0.05 && x < s[1] - 0.05));
  buildPieces(); buildCaps(); findAutoIssues();
  if (!thumbs || thumbs.src.indexOf(P.thumbs.url) < 0) loadThumbs();
  $("undo").disabled = !P.can_undo; $("redo").disabled = !P.can_redo;
  const kp = (P.tuning && P.tuning.keep_pause) || 0.3, opts = [...$("pause").options].map((o) => +o.value);
  $("pause").value = opts.reduce((a, b) => (Math.abs(b - kp) < Math.abs(a - kp) ? b : a)).toFixed(2);
  $("pvsel").innerHTML = (P.previews || []).map((f) => `<option value="${f}">${esc(f.replace(P.name + "_", "").replace(".mp4", ""))}</option>`).reverse().join("") || `<option value="">walang preview</option>`;
  if (needFit && W() > 50 && dur > 0) { fit(); needFit = false; }
  renderAll(); draw(); updateTime();
  clearTimeout(apply._g);
  const refreshGfx = async () => {
    const q = await api(`/api/project/${P.name}`);
    if (q.name === P.name) { P.overlays = q.overlays; P.scenes = q.scenes; updateTime(); if (tab === "scenes") renderLeft(); if (P.overlays.some((o) => !o.url)) apply._g = setTimeout(refreshGfx, 4000); }
  };

    <li><b>Transcript</b> (kanan) = lahat ng sinabi mo. <s style="color:#9C7A73">Naka-strike</s> = inalis. I-click ang salita para pakinggan, i-drag para pumili → ✂ Tanggalin / ↺ Ibalik / ✎ Caption.</li>
    <li><b>Timeline</b>: drag ang gilid ng clip para i-trim, <kbd>S</kbd> split, <kbd>Del</kbd> delete, double-click ang caption para i-edit.</li>
    <li><b>⚑ Flag</b> (<kbd>M</kbd>) ang mali habang nanonood — si Claude ang mag-aayos.</li>
    <li><b>Live edit</b> vs <b>Rendered</b>: panoorin ang huling render na may buong graphics.</li></ol>
    <div style="text-align:right"><button class="primary" id="hok">Gets!</button></div></div>`;
  $("modal").classList.add("show");
  $("hok").onclick = () => { $("modal").classList.remove("show"); try { localStorage.setItem("seenHelp2", "1"); } catch (e) {} };
}
$("help").onclick = showHelp;
resize(); loadProjects();
</script>

  document.getElementById("lgN").textContent = n; document.getElementById("lgI").textContent = n.trim()[0].toUpperCase(); document.title = n + " · Fine-tune"; }).catch(() => {});</script>
