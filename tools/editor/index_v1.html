<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBD Video Editor</title>
<style>
  @font-face{font-family:"Inter Tight";font-weight:800;src:url("/fonts/InterTight-wght-800.ttf")}
  @font-face{font-family:"Inter Tight";font-weight:900;src:url("/fonts/InterTight-wght-900.ttf")}
  :root{--bg:#0a0f16;--panel:#111923;--panel2:#16212e;--line:#233142;--text:#e8edf3;--mut:#8BA3B8;--o:#FF6B35;--o2:#ff8a5c;--red:#ff5d5d;--yel:#ffcc4d;--blue:#5ab0ff;--green:#4cd28a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;overflow:hidden}
  button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){border-color:var(--o)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}
  button.icon{padding:6px 9px}
  .app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
  /* top bar */
  .top{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:800;margin-right:6px}.brand b{color:var(--o)}
  .grow{flex:1}
  .status{color:var(--mut);font-size:12px}
  .status.busy{color:var(--yel)}
  /* middle */
  .mid{display:grid;grid-template-columns:300px 1fr 300px;min-height:0}
  .side.r{border-right:0;border-left:1px solid var(--line)}
  .sidehd{padding:11px 12px;font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .sidehd .cnt{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--panel2);font-size:11px;text-align:center}
  .sidehd .cnt.hot{background:#ff4d4d;color:#fff}
  .side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 4px;color:var(--mut);font-weight:600}
  .tabs button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--o)}
  .tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--panel2);font-size:11px}
  .tabs .cnt.hot{background:var(--yel);color:#111}
  .list{flex:1;overflow:auto;padding:8px}
  .item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 10px;margin-bottom:8px}
  .item.done{opacity:.45}
  .item .hd{display:flex;gap:8px;align-items:center;margin-bottom:5px;color:var(--mut);font-size:11.5px}
  .item .hd .tag{padding:1px 7px;border-radius:9px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
  .tag.dbl{background:rgba(255,77,77,.2);color:#ff7070}
  .tag.low{background:rgba(90,176,255,.15);color:var(--blue)}
  .tag.cut{background:rgba(255,93,93,.15);color:var(--red)}
  .item .tx{font-size:14px;margin-bottom:8px;line-height:1.45}
  .item .tx mark{background:rgba(255,77,77,.45);color:#fff;border-radius:3px;padding:0 2px}
  .item.low .tx mark{background:rgba(90,176,255,.35)}
  .item.dbl{border-color:rgba(255,77,77,.45)}
  .item .tx s{color:#7d8ea3}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap}
  .item .acts button{padding:4px 9px;font-size:12px}
  .empty{color:var(--mut);padding:18px 10px;text-align:center;line-height:1.6}
  .script{font-size:15px;line-height:1.75;padding:12px}
  .script span{cursor:pointer;border-radius:3px;padding:0 1px}
  .script span:hover{background:var(--panel2)}
  .script span.now{background:var(--o);color:#fff}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:10px;gap:8px}
  .vwrap{position:relative;margin:0 auto;height:100%;max-height:100%;aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden;min-height:0;flex:1}
  .vwrap video{width:100%;height:100%;object-fit:contain;display:block}
  .vwrap .cap{position:absolute;left:5%;right:5%;top:62%;transform:translateY(-50%);text-align:center;font-family:"Inter Tight",Inter,sans-serif;font-weight:800;font-size:clamp(13px,2.4vh,30px);letter-spacing:-.01em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.75);pointer-events:none;z-index:3}
  .vwrap .cap .kw{color:var(--o);font-weight:900;font-size:1.38em}
  #gv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none;z-index:2}
  #vid{transition:filter .2s}
  #vid.blur{filter:blur(10px) brightness(.85)}
  .vwrap .gfx{position:absolute;z-index:4;left:8px;top:8px;background:rgba(255,107,53,.9);color:#fff;font-weight:700;font-size:11px;padding:3px 8px;border-radius:7px;display:none}
  .transport{display:flex;gap:8px;align-items:center}
  .transport .time{font:600 13px ui-monospace,Menlo,monospace;color:var(--mut);min-width:150px;text-align:center}
  .transport .time b{color:var(--text)}
  .play{width:42px;height:42px;border-radius:50%;background:var(--o);border:0;color:#fff;font-size:17px;font-weight:800}
  /* timeline */
  .tl{border-top:1px solid var(--line);background:var(--panel)}
  .tlbar{display:flex;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
  .tlbar .hint{color:var(--mut);font-size:12px;margin-left:6px}
  .tlbar input[type=range]{width:140px;accent-color:var(--o)}
  .tlwrap{position:relative;display:flex}
  .labels{width:84px;flex:none;border-right:1px solid var(--line)}
  .labels div{display:flex;align-items:center;padding-left:10px;color:var(--mut);font-size:11.5px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.03)}
  canvas{display:block;cursor:pointer}
  .hscroll{height:12px;margin-left:84px;position:relative;background:var(--panel2)}
  .hscroll i{position:absolute;top:2px;height:8px;border-radius:4px;background:#3a4b61;cursor:grab}
  .toast{position:fixed;right:14px;top:56px;max-width:440px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;white-space:pre-wrap;font-size:12.5px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:9}
  .toast.show{display:block}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(460px,92vw)}
  .modal input{width:100%;font:15px/1.4 inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:10px 0}
  .welcome{line-height:1.6}
  .welcome li{margin:4px 0}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
  @media (max-width:1150px){.mid{grid-template-columns:240px 1fr 240px}}
  @media (max-width:680px){.mid{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="brand">BBD <b>Video Editor</b></span>
    <select id="proj"></select>
    <button class="icon" id="undo" title="Undo (⌘Z)">↶ Undo</button>
    <button class="icon" id="redo" title="Redo (⌘⇧Z)">↷ Redo</button>
    <span class="status" id="status">✓ Naka-save</span>
    <span class="grow"></span>
    <button id="help">❔ Paano?</button>
    <button id="rPrev">Export preview</button>
    <button class="primary" id="rFinal">Export final</button>
  </div>

  <div class="mid">
    <aside class="side">
      <div class="sidehd">🚩 Minarkahan mo <span class="cnt" id="cMarks">0</span></div>
      <div id="marks" style="max-height:38%;overflow:auto;padding:8px;border-bottom:1px solid var(--line)"></div>
      <div class="sidehd">✅ Dapat i-check <span class="cnt" id="cCheck">0</span></div>
      <div class="list" id="listL"></div>
    </aside>
    <section class="stage">
      <div class="vwrap"><video id="vid" playsinline preload="auto"></video><video id="gv" muted playsinline preload="auto"></video><div class="cap" id="cap"></div><div class="gfx" id="gfx"></div></div>
      <div class="transport">
        <button class="icon" id="back" title="-2s">⏪</button>
        <button class="play" id="play" title="Space">▶</button>
        <button class="icon" id="fwd" title="+2s">⏩</button>
        <span class="time" id="time"><b>0:00.0</b> / 0:00.0</span>
      </div>
    </section>
    <aside class="side r">
      <div class="tabs">
        <button data-tab="cuts" class="on">Tinanggal<span class="cnt" id="cCuts">0</span></button>
        <button data-tab="gfx">Graphics<span class="cnt" id="cGfx">0</span></button>
        <button data-tab="script">Script</button>
      </div>
      <div class="list" id="listR"></div>
    </aside>
  </div>

  <div class="tl">
    <div class="tlbar">
      <button id="split" title="S">✂ Split</button>
      <button id="del" title="Delete">🗑 Delete clip</button>
      <button id="mark" title="M — markahan ang mali dito (aayusin ni Claude)" style="border-color:#ff4d4d">🚩 Mark mali (M)</button>
      <span class="hint">Dead air:</span>
      <select id="pause" title="Gaano kahaba ang natitirang pause sa pagitan ng mga linya (buong video)">
        <option value="0.15">Mabilis · 0.15s</option><option value="0.30">Normal · 0.30s</option>
        <option value="0.45">Natural · 0.45s</option><option value="0.60">Mabagal · 0.60s</option></select>
      <span class="hint" id="hint"><b>I-drag ang gilid ng clip</b> para i-trim o ibalik ang dead air · <kbd>Alt</kbd> = walang snap · <kbd>S</kbd> split · <kbd>Del</kbd> delete</span>
      <span class="grow"></span>
      <span class="hint">Zoom</span><input type="range" id="zoom" min="0" max="100" value="0">
    </div>
    <div class="tlwrap">
      <div class="labels" id="labels"></div>
      <canvas id="cv"></canvas>
    </div>
    <div class="hscroll" id="hs"><i id="hsk"></i></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const vid = $("vid"), cv = $("cv"), ctx = cv.getContext("2d");
const TR = { ruler: 22, video: 70, caps: 30, gfx: 26 };
const TRH = TR.ruler + TR.video + TR.caps + TR.gfx;
let P = null, segs = [], segOff = [], dur = 0, pieces = [], splits = [], selPiece = -1;
let pps = 10, view0 = 0, playing = false, thumbs = null, caps = [], issues = [], dismissed = new Set(), tab = "cuts";
let busy = false, poll = null, stopAt = null, srcMode = false, needFit = true;

const tc = (t) => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, "0"); return `${m}:${s}`; };
const norm = (w) => (w || "").toLowerCase().replace(/[^\p{L}\p{N}']+/gu, "");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (m, ms = 3500) => { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._t); if (ms) el._t = setTimeout(() => el.classList.remove("show"), ms); };
const wtext = (i) => (P.fixes[i] !== undefined ? P.fixes[i] : P.words[i].w);
async function api(path, body) { const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}); return r.json(); }
function setBusy(b, msg) { busy = b; $("status").textContent = b ? (msg || "⏳ Ina-apply…") : "✓ Naka-save"; $("status").className = "status" + (b ? " busy" : ""); }

/* ---------------- projects ---------------- */
async function loadProjects() {
  const items = await api("/api/projects");
  $("proj").innerHTML = items.map((p) => `<option value="${p.name}">${esc(p.src.slice(0, 13))}…  ${tc(p.dur)} → ${p.new_dur ? tc(p.new_dur) : "?"}</option>`).join("");
  let want = null; try { want = localStorage.getItem("proj"); } catch (e) {}
  if (want && items.some((p) => p.name === want)) $("proj").value = want;
  await open($("proj").value);
  let seen = null; try { seen = localStorage.getItem("seenHelp"); } catch (e) {}
  if (!seen) showHelp();
}
$("proj").onchange = () => open($("proj").value);

async function open(name) {
  needFit = true;
  try { localStorage.setItem("proj", name); dismissed = new Set(JSON.parse(localStorage.getItem("dis:" + name) || "[]")); } catch (e) { dismissed = new Set(); }
  apply(await api(`/api/project/${name}`));
  waitProxy();
  if (P.job && P.job.state === "running") watch();
}

function apply(data) {
  P = data;
  segs = P.segments; segOff = []; let o = 0; segs.forEach((s) => { segOff.push(o); o += s[1] - s[0]; }); dur = o || P.new_dur || 0;
  splits = splits.filter((x) => segs.some((s) => x > s[0] + 0.05 && x < s[1] - 0.05));
  buildPieces(); buildCaps(); findIssues();
  if (!thumbs || thumbs.src !== P.thumbs.url) loadThumbs();
  $("undo").disabled = !P.can_undo; $("redo").disabled = !P.can_redo;
  const kp = (P.tuning && P.tuning.keep_pause) || 0.3, opts = [...$("pause").options].map((o) => +o.value);
  $("pause").value = opts.reduce((a, b) => (Math.abs(b - kp) < Math.abs(a - kp) ? b : a)).toFixed(2);
  if (needFit && W() > 50 && dur > 0) { fit(); needFit = false; }
  renderList(); draw(); updateTime();
  clearTimeout(apply._g);
  const refreshGfx = async () => {  // graphic previews still converting → poll until ready
    const q = await api(`/api/project/${P.name}`);
    if (q.name === P.name) { P.overlays = q.overlays; updateTime(); if (P.overlays.some((o) => !o.url)) apply._g = setTimeout(refreshGfx, 4000); }
  };
  if (P.overlays.some((o) => !o.url)) apply._g = setTimeout(refreshGfx, 4000);
}

function waitProxy() {
  if (P.proxy === "ready") { if (!vid.src.includes(P.name)) { vid.src = `/media/${P.name}/proxy.mp4`; vid.currentTime = segs[0] ? segs[0][0] : 0; } return; }
  toast("Inihahanda ang video (isang beses lang, mga 1 minuto)…", 0);
  setTimeout(async () => { const q = await api(`/api/project/${P.name}`); P.proxy = q.proxy; P.thumbs = q.thumbs; if (q.proxy === "ready") { $("toast").classList.remove("show"); loadThumbs(); } waitProxy(); }, 4000);
}
function loadThumbs() {
  if (!P.thumbs.ready) { setTimeout(async () => { const q = await api(`/api/project/${P.name}`); P.thumbs = q.thumbs; loadThumbs(); }, 5000); return; }
  const img = new Image(); img.onload = () => { thumbs = img; draw(); }; img.src = P.thumbs.url + "?v=" + P.name; thumbs = null;
}

/* ---------------- time mapping ---------------- */
function e2s(t) { // edited → source
  for (let k = 0; k < segs.length; k++) if (t < segOff[k] + (segs[k][1] - segs[k][0]) || k === segs.length - 1) return segs[k][0] + Math.max(0, t - segOff[k]);
  return 0;
}
function s2e(t) { // source → edited (null if cut)
  for (let k = 0; k < segs.length; k++) if (t >= segs[k][0] - 0.01 && t <= segs[k][1] + 0.01) return segOff[k] + (t - segs[k][0]);
  return null;
}
const editedNow = () => { const e = s2e(vid.currentTime); return e === null ? lastE : e; };
let lastE = 0;

function buildPieces() {
  pieces = [];
  segs.forEach((s, k) => {
    const cuts = splits.filter((x) => x > s[0] && x < s[1]).sort((a, b) => a - b);
    let a = s[0];
    for (const x of [...cuts, s[1]]) { pieces.push({ s: a, e: x, eo: segOff[k] + (a - s[0]) }); a = x; }
  });
  if (selPiece >= pieces.length) selPiece = -1;
}

function buildCaps() {
  caps = []; let cur = null;
  for (const [k, s, e] of P.words_out) {
    const t = wtext(k); if (!t) continue;
    const brk = cur && (cur.ids.length >= 3 || s - cur.e > 0.45 || (cur.text + " " + t).length > 18 || /[.?!,]$/.test(cur.text));
    if (!cur || brk) { cur = { s, e, ids: [k], text: t }; caps.push(cur); }
    else { cur.ids.push(k); cur.e = e; cur.text += (t.startsWith("-") ? "" : " ") + t; }
  }
}

/* ---------------- issues (doubles / incomplete) ---------------- */
function findIssues() {
  const wo = P.words_out, n = wo.map(([k]) => norm(wtext(k)));
  const found = [], used = new Set();
  for (let j = 1; j < wo.length; j++) {
    for (const g of [4, 3, 2, 1]) {
      if (j < 2 * g - 1) continue;
      let same = true;
      for (let q = 0; q < g; q++) if (!n[j - q] || n[j - q] !== n[j - g - q]) { same = false; break; }
      if (!same) continue;
      const first = wo.slice(j - 2 * g + 1, j - g + 1).map((x) => x[0]);
      if (first.some((i) => used.has(i))) break;
      if (g === 1 && /^(na|ng|ang|sa|ay|po|ka|mo|ko)$/.test(n[j])) break; // common Tagalog particles repeat naturally
      first.forEach((i) => used.add(i));
      found.push({ kind: "dbl", ids: first, all: wo.slice(j - 2 * g + 1, j + 1).map((x) => x[0]), t: wo[j - 2 * g + 1][1] });
      break;
    }
  }
  for (const [k, s] of wo) {
    const w = P.words[k];
    if (w.p < 0.15 || /(\.\.\.|…)$/.test(w.w) || (/-$/.test(w.w) && w.w.length > 1)) found.push({ kind: "low", ids: [k], all: [k], t: s });
  }
  issues = found.sort((a, b) => a.t - b.t).map((x) => ({ ...x, key: x.kind + ":" + x.ids.join(",") }));
  const open = issues.filter((x) => !dismissed.has(x.key)).length;
  $("cCheck").textContent = open; $("cCheck").className = "cnt" + (open ? " hot" : "");
  $("cCuts").textContent = P.cuts.length;
  $("cGfx").textContent = P.overlays.length;
}

function context(ids, all, around = 5) {
  const pos = P.words_out.findIndex(([k]) => k === all[0]);
  const end = P.words_out.findIndex(([k]) => k === all[all.length - 1]);
  const a = Math.max(0, pos - around), b = Math.min(P.words_out.length, end + around + 1);
  return glue(P.words_out.slice(a, b).map(([k]) => [wtext(k), ids.includes(k) ? `<mark>${esc(wtext(k))}</mark>` : all.includes(k) ? `<b>${esc(wtext(k))}</b>` : esc(wtext(k))]));
}

const glue = (pairs) => pairs.filter(([t]) => t !== "").map(([t, h], n) => (n && t.startsWith("-") ? h : (n ? " " : "") + h)).join("");

function renderList() { renderMarks(); renderChecks(); renderRight(); }
function renderMarks() {
  const M = P.marks || [];
  $("cMarks").textContent = M.length; $("cMarks").className = "cnt" + (M.length ? " hot" : "");
  $("marks").innerHTML = M.length ? M.map((m) => `<div class="item" style="border-color:rgba(255,77,77,.5)">
      <div class="hd"><span class="tag dbl">🚩 mali</span>${tc(m.out)}</div>
      <div class="tx">${m.note ? esc(m.note) : "<span style='color:var(--mut)'>(walang note)</span>"}</div>
      <div class="acts"><button data-mk="play" data-id="${m.id}">▶ Pakinggan</button><button data-mk="del" data-id="${m.id}">✕ Alisin</button></div></div>`).join("")
    : `<div class="empty" style="padding:8px">Habang nanonood, pindutin ang <b>M</b> (o 🚩) sa bawat parteng may mali — doble, putol, ingay. Si Claude na ang mag-aayos.</div>`;
}
async function addMark() {
  const out = editedNow(), src = e2s(out);
  vid.pause();
  const note = prompt(`🚩 Markahan ang ${tc(out)} — ano ang mali? (hal. "doble ang tapos", "may ingay", "putol")`, "");
  if (note === null) return;
  const r = await api(`/api/project/${P.name}/mark`, { out, src, note }); P.marks = r.marks; renderMarks(); draw();
  toast(`🚩 Namarkahan ang ${tc(out)}. Sabihin kay Claude: "ayusin ang mga minarkahan ko".`);
}
$("mark").onclick = addMark;
$("marks").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-mk]"); if (!b) return;
  const m = (P.marks || []).find((x) => x.id === +b.dataset.id); if (!m) return;
  if (b.dataset.mk === "play") playRangeE(m.out - 2, m.out + 2);
  else { const r = await api(`/api/project/${P.name}/unmark`, { id: m.id }); P.marks = r.marks; renderMarks(); draw(); }
});

function renderChecks() {
  const L = $("listL");
  if (!issues.length) { L.innerHTML = `<div class="empty">Walang nakitang posibleng doble o kulang na salita. 🎉<br>Panoorin pa rin ang video para sigurado.</div>`; return; }
  L.innerHTML = issues.map((x, n) => `<div class="item ${x.kind}${dismissed.has(x.key) ? " done" : ""}">
    <div class="hd"><span class="tag ${x.kind}">${x.kind === "dbl" ? "posibleng doble" : "posibleng kulang"}</span>${tc(x.t)}</div>
    <div class="tx">${context(x.ids, x.all)}</div>

  if (e) {
    const p = pieces[e.i];
    trim = { i: e.i, edge: e.edge, orig: e.edge === "r" ? p.e : p.s, newSrc: e.edge === "r" ? p.e : p.s, x0: ev.clientX, snapped: false };
    selPiece = e.i; vid.pause(); draw(); ev.preventDefault(); return;
  }
  if (y < TR.ruler + 3 || Math.abs(x - X(lastE)) < 6) { drag = "head"; seekE(t); return; }
  if (y < TR.ruler + TR.video) { selPiece = pieces.findIndex((p) => t >= p.eo && t < p.eo + (p.e - p.s)); }
  drag = "head"; seekE(t);
});
window.addEventListener("mousemove", (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (trim) {
    const [lo, hi] = limits(trim.i, trim.edge);
    let v = trim.orig + (ev.clientX - trim.x0) / pps;
    const [sv, hit] = snapSrc(v, ev.altKey);
    trim.newSrc = Math.max(lo, Math.min(hi, sv)); trim.snapped = hit;
    draw(); return;
  }
  if (drag === "head") { seekE(view0 + x / pps); return; }
  if (x < 0 || y < 0 || x > W() || y > TRH) { if (hoverEdge) { hoverEdge = null; draw(); } return; }
  const e = edgeAt(x, y);
  const changed = JSON.stringify(e && [e.i, e.edge]) !== JSON.stringify(hoverEdge && [hoverEdge.i, hoverEdge.edge]);
  hoverEdge = e; cv.style.cursor = e ? "ew-resize" : Math.abs(x - X(lastE)) < 6 || y < TR.ruler + 3 ? "col-resize" : "pointer";
  if (changed) draw();
});
window.addEventListener("mouseup", async () => {
  drag = null;
  if (!trim) return;
  const t0 = trim; trim = null;
  const d = t0.newSrc - t0.orig;
  if (Math.abs(d) < 0.03) { draw(); return; }
  const grow = t0.edge === "r" ? d > 0 : d < 0;
  const a = Math.min(t0.orig, t0.newSrc), b = Math.max(t0.orig, t0.newSrc);
  const lost = grow ? [] : wordsIn(a, b);
  if (lost.length && !confirm(`⚠ Puputulin nito ang salita: “${lost.join(" ")}”.\n\nDead air lang ba ang gusto mong tanggalin? Pindutin ang Cancel at mag-zoom in para mas tumpak.\n\nOK = tanggalin pa rin ang salita.`)) { draw(); return; }
  await doOp({ type: grow ? "trim_keep" : "trim_cut", a, b }, grow ? `✓ Naibalik ang ${(b - a).toFixed(2)}s.` : `✓ Natrim ang ${(b - a).toFixed(2)}s.`);
});
$("pause").onchange = () => doOp({ type: "tuning", keep_pause: +$("pause").value }, `✓ Dead air: ${$("pause").selectedOptions[0].text}`);
cv.addEventListener("dblclick", (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, t = view0 + x / pps;
  if (y >= TR.ruler + TR.video && y < TR.ruler + TR.video + TR.caps) { const c = caps.find((c) => t >= c.s && t <= c.e); if (c) editCaption(c); }
});
cv.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) { const r = cv.getBoundingClientRect(), at = view0 + (ev.clientX - r.left) / pps; const minp = (W() - 20) / Math.max(dur, 1); pps = Math.max(minp, Math.min(120, pps * Math.exp(-ev.deltaY / 300))); view0 = at - (ev.clientX - r.left) / pps; zoomFromPps(); }
  else view0 += (ev.deltaX || ev.deltaY) / pps;
  clampView(); draw();
}, { passive: false });
(() => { let d = null; $("hsk").addEventListener("mousedown", (e) => (d = { x: e.clientX, v: view0 })); window.addEventListener("mousemove", (e) => { if (!d) return; view0 = d.v + (e.clientX - d.x) / $("hs").clientWidth * dur; clampView(); draw(); }); window.addEventListener("mouseup", () => (d = null)); })();

function editCaption(c) {
  $("mbox").innerHTML = `<b>I-edit ang caption</b><div class="status">Captions lang ang mababago, hindi ang boses. Walang laman = itago ang caption na ito.</div>
    <input id="capin" value="${esc(c.text)}"><div class="row" style="display:flex;gap:8px;justify-content:flex-end"><button id="capx">Cancel</button><button class="primary" id="capok">Save</button></div>`;
  $("modal").classList.add("show"); const inp = $("capin"); inp.focus(); inp.select();
  const close = () => $("modal").classList.remove("show");
  $("capx").onclick = close;
  $("capok").onclick = async () => { const v = inp.value.trim(); close(); if (v !== c.text) await doOp({ type: "caption", ids: c.ids, text: v }, "✓ Na-update ang caption."); };
  inp.onkeydown = (e) => { if (e.key === "Enter") $("capok").click(); if (e.key === "Escape") close(); };
}

document.addEventListener("keydown", (e) => {
  if ($("modal").classList.contains("show") || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  else if (e.key === "s" || e.key === "S") { if (!e.metaKey && !e.ctrlKey) doSplit(); }
  else if (e.key === "m" || e.key === "M") { if (!e.metaKey && !e.ctrlKey) addMark(); }
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); doDelete(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? $("redo").click() : $("undo").click(); }
  else if (e.key === "ArrowLeft") seekE(editedNow() - (e.shiftKey ? 5 : 0.5), !vid.paused);
  else if (e.key === "ArrowRight") seekE(editedNow() + (e.shiftKey ? 5 : 0.5), !vid.paused);
});

/* ---------------- export ---------------- */
async function doRender(final) {
  if (final && !confirm("I-export ang FINAL 1080p? (ilang minuto)")) return;
  await api(`/api/project/${P.name}/render`, { final }); watch();
}
$("rPrev").onclick = () => doRender(false);
$("rFinal").onclick = () => doRender(true);
function watch() {
  clearInterval(poll); $("rPrev").disabled = $("rFinal").disabled = true; setBusy(true, "⏳ Nag-e-export…");
  poll = setInterval(async () => {
    const q = await api(`/api/project/${P.name}`); const j = q.job || {};
    toast((j.log || "…").trim() + (j.state === "running" ? "\n\n(tumatakbo…)" : ""), 0);
    if (j.state !== "running") {
      clearInterval(poll); $("rPrev").disabled = $("rFinal").disabled = false; setBusy(false);
      if (j.state === "done" && j.output) { toast(`✓ Tapos ang export!\n${j.output}\nNasa output/ folder.`, 0); window.open(`/out/${j.output}`, "_blank"); }
    }
  }, 2500);
}

function showHelp() {
  $("mbox").innerHTML = `<div class="welcome"><b style="font-size:16px">Paano gamitin 👋</b><ol>
    <li><b>▶ Play</b> (o <kbd>Space</kbd>): ang edited version ang pinapanood mo.</li>
    <li>Sa kaliwa, <b>“Dapat i-check”</b>: listahan ng posibleng <b>doble</b> (<span style="color:#ff6b6b;font-weight:700">pula</span> sa timeline) o <b>kulang</b> na salita. I-click ang <b>▶ Pakinggan</b>, tapos <b>✂ Tanggalin</b> o <b>✓ Okay lang</b>.</li>
    <li><b>I-drag ang gilid ng clip</b> (orange na hawakan) para paikliin, o hilahin palabas para <b>ibalik ang dead air</b> / natanggal. Ang <b>puting guhit</b> sa ilalim ng clip = may salita; ang puwang = dead air. Magbababala ang editor kapag may salitang mapuputol. Ang <b>Dead air</b> menu ay para sa buong video.</li><li>Sa timeline, i-click ang lugar para pumunta doon. Pindutin ang <b>✂ Split</b> (<kbd>S</kbd>), i-click ang clip, tapos <b>🗑 Delete</b> (<kbd>Del</kbd>). Gaya sa CapCut. Hindi napuputol ang salita sa split.</li>
    <li><b>Double-click ang caption</b> sa timeline para ayusin ang spelling.</li>
    <li>May natanggal na dapat ibalik? Sa kanan, <b>“Tinanggal”</b> tab → <b>↺ Ibalik</b>. Ang <b>“Graphics”</b> tab ay listahan ng lahat ng motion graphics.</li>
    <li><b>🚩 May nakita kang mali?</b> Pindutin ang <kbd>M</kbd> habang nanonood (puwedeng may maikling note). Sabihin kay Claude na “ayusin ang mga minarkahan ko” — siya na ang bahala.</li><li>Nagkamali? <b>↶ Undo</b> (<kbd>⌘Z</kbd>). Lahat ay auto-save.</li>
    <li>Kapag okay na: <b>Export preview</b> (mabilis, 720p) o <b>Export final</b> (1080p).</li></ol>
    <div style="text-align:right"><button class="primary" id="hok">Gets!</button></div></div>`;
  $("modal").classList.add("show");
  $("hok").onclick = () => { $("modal").classList.remove("show"); try { localStorage.setItem("seenHelp", "1"); } catch (e) {} };
}
$("help").onclick = showHelp;

resize();
loadProjects();
</script>
