<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<style>
  @font-face{font-family:"Inter Tight";font-weight:500;src:url("/fonts/InterTight-wght-500.ttf")}
  @font-face{font-family:"Inter Tight";font-weight:600;src:url("/fonts/InterTight-wght-600.ttf")}
  @font-face{font-family:"Inter Tight";font-weight:700;src:url("/fonts/InterTight-wght-700.ttf")}
  @font-face{font-family:"Inter Tight";font-weight:800;src:url("/fonts/InterTight-wght-800.ttf")}
  @font-face{font-family:"Inter Tight";font-weight:900;src:url("/fonts/InterTight-wght-900.ttf")}
  @font-face{font-family:"Great Vibes";src:url("/fonts/GreatVibes.ttf")}
  @font-face{font-family:"Playfair Display";font-weight:800;src:url("/fonts/PlayfairDisplay-800.ttf")}
  @font-face{font-family:"Playfair Display";font-weight:900;src:url("/fonts/PlayfairDisplay-900.ttf")}
  @font-face{font-family:"Anton";font-weight:400 900;src:url("/fonts/Anton-400.ttf")}
  @font-face{font-family:"Poppins";font-weight:800;src:url("/fonts/Poppins-800.ttf")}
  @font-face{font-family:"Poppins";font-weight:900;src:url("/fonts/Poppins-900.ttf")}
  @font-face{font-family:"Montserrat";font-weight:800;src:url("/fonts/Montserrat-800.ttf")}
  @font-face{font-family:"Montserrat";font-weight:900;src:url("/fonts/Montserrat-900.ttf")}
  @font-face{font-family:"Caveat";font-weight:400 900;src:url("/fonts/Caveat-700.ttf")}
  @font-face{font-family:"Dancing Script";font-weight:400 900;src:url("/fonts/DancingScript-700.ttf")}
  :root{
    --bg:#0F0D0C;--panel:#171513;--panel2:#1E1B19;--panel3:#272320;--line:#2C2724;--line2:#3A3430;
    --text:#F4EFEA;--mut:#A39990;--dim:#6F6761;--o:#FF6A00;--o2:#FF9A4D;--osoft:rgba(255,106,0,.13);--ink:#1A0B04;
    --ok:#3FBF7F;--bad:#FF5A4E;--r:18px;
    --ui:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;--disp:"Inter Tight",var(--ui)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  .app{display:grid;grid-template-rows:60px auto 1fr 72px;height:100vh}
  /* top bar */
  .top{display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:10px;font:900 17px var(--disp);letter-spacing:-.02em;min-width:0}
  .logo i{width:30px;height:30px;border-radius:9px;background:var(--o);display:grid;place-items:center;color:var(--ink);font-style:normal;font-size:15px;flex:none}
  .sname{border:1px dashed transparent;border-radius:8px;padding:3px 7px;cursor:text;white-space:nowrap;outline:none;max-width:320px;overflow:hidden;text-overflow:ellipsis}
  .sname:hover{border-color:var(--line2)}
  .sname:focus{border-color:var(--o);background:var(--panel2);text-overflow:clip}
  .pen{color:var(--dim);font-size:13px;cursor:pointer;border:0;background:none;padding:2px}
  .pen:hover{color:var(--text)}
  .projchip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);max-width:300px}
  .projchip img{width:26px;height:40px;object-fit:cover;border-radius:6px;background:#000}
  .projchip b{font:800 13px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .projchip small{color:var(--mut);white-space:nowrap}
  .grow{flex:1}
  .lang{display:flex;padding:3px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .lang button{border:0;background:transparent;color:var(--mut);padding:4px 10px;border-radius:7px;font-weight:700;font-size:12px}
  .lang button.on{background:var(--panel3);color:var(--text)}
  .tlink{color:var(--mut);text-decoration:none;font-weight:600;font-size:13px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:none}
  .tlink:hover{color:var(--text);border-color:var(--line2)}
  .status{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;white-space:nowrap}
  .status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .status.busy:before{background:var(--o2);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  /* stepper */
  .steps{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
  .steps button{border:0;background:transparent;color:var(--mut);padding:14px 14px 12px;font:700 14px var(--disp);letter-spacing:-.01em;
    border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .steps button .num{color:var(--dim)}
  .steps button.done{color:var(--text)}
  .steps button.done .ck{color:var(--o)}
  .steps button.on{color:var(--text);border-bottom-color:var(--o)}
  .steps button:hover{color:var(--text)}
  /* body */
  .body{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
  .left{padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;border-right:1px solid var(--line);min-height:0}
  .phone{position:relative;height:min(100%,640px);aspect-ratio:9/16;border-radius:24px;overflow:hidden;background:#000;flex:1 1 auto;
    box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px var(--line2)}
  .phone video,.phone .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .phone .still{display:none}
  #gv{pointer-events:none;display:none;z-index:3}
  #skb{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
  .layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .pbar{position:absolute;left:5.9%;right:5.9%;top:3.3%;height:.42%;border-radius:4px;background:rgba(140,106,85,.55);overflow:hidden;z-index:6;display:none}
  .pbar i{display:block;height:100%;width:0}
  .cap{position:absolute;left:4%;right:4%;text-align:center;color:#fff;z-index:5;line-height:1.08;pointer-events:none;
    text-shadow:0 0 2px rgba(0,0,0,.85),0 2px 5px rgba(0,0,0,.6),0 6px 26px rgba(0,0,0,.55)}
  .cap .bx{background:var(--acc);color:var(--ink2);padding:.05em .26em .09em;border-radius:.1em;text-shadow:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .cap.ol{text-shadow:0 .06em .08em rgba(0,0,0,.55);-webkit-text-stroke:.11em #000;paint-order:stroke fill}
  /* demo playback (click a card → it plays here, with sound) */
  #dv,#dc{display:none;z-index:1}
  #dc{z-index:3;pointer-events:none}
  #dlb{z-index:2} #dlf{z-index:4}
  .phone.demo:not(.main) #vid,.phone.demo:not(.main) #skb,.phone.demo:not(.main) #still,.phone.demo:not(.main) #gv,.phone.demo:not(.main) #cap,.phone.demo:not(.main) #pbar,.phone.demo #hookLayer{display:none!important}
  .phone.demo:not(.main) #dv{display:block}
  .dbadge{position:absolute;left:10px;right:10px;bottom:10px;z-index:9;display:none;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-radius:12px;
    background:rgba(12,10,9,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:700 12px var(--ui);color:#fff;pointer-events:auto}
  .dbadge i{width:8px;height:8px;border-radius:50%;background:var(--o);animation:pulse 1s infinite;flex:none}
  .dbadge span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbadge button{border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;padding:4px 9px;font-weight:800}
  .phone.demo .dbadge{display:flex}
  .ctrl{display:flex;align-items:center;gap:10px}
  .ctrl button{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px}
  .ctrl button.play{background:var(--o);border-color:var(--o);color:var(--ink);min-width:74px}
  .ctrl .t{font:600 12.5px ui-monospace,Menlo,monospace;color:var(--mut)}
  .ctrl button.mini{padding:6px 9px;min-width:0;font-size:13px;color:var(--mut)}
  .ctrl button.mini.on{color:var(--o2);border-color:rgba(255,140,60,.55)}
  /* live graphics: the real scene page (HTML + GSAP), seeked to the playhead — no render needed */
  .gframe{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0;transform-origin:0 0;pointer-events:none;z-index:3;display:none;background:transparent;color-scheme:normal}
  /* platform safe zones (TikTok / Reels / Shorts interface over a 1080×1920 frame) */
  .safe{position:absolute;inset:0;z-index:8;pointer-events:none;display:none;font:700 9px var(--ui);color:#fff}
  .safe.on{display:block}
  .safe i{position:absolute;background:rgba(255,60,60,.16);border:1px dashed rgba(255,120,120,.75);border-radius:6px}
  .safe b{position:absolute;left:6px;top:4px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.6)}
  .hintchip{font-size:11.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;text-align:center}
  .right{overflow:auto;padding:26px 30px 40px}
  .kick{font:800 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--o2);margin-bottom:6px}
  h1{font:900 30px/1.1 var(--disp);letter-spacing:-.025em;margin:0 0 8px}
  h2{font:900 18px var(--disp);letter-spacing:-.01em;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  h2 small{font:600 12.5px var(--ui);color:var(--mut)}
  .lead{color:var(--mut);font-size:15px;margin:0 0 18px;max-width:760px}
  .howto{display:inline-flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin:-6px 0 16px}
  .howto b{color:var(--text)}
  .seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin:0 0 18px}
  .seg button{border:0;background:transparent;color:var(--mut);padding:7px 16px;border-radius:9px;font-weight:700}
  .seg button.on{background:var(--o);color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
  .card{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 10px 14px;transition:border-color .15s,transform .15s;cursor:pointer;outline:none}
  .card:hover{border-color:var(--line2);transform:translateY(-2px)}
  .card:focus-visible{border-color:var(--o)}
  .card.picked{border-color:var(--text);box-shadow:0 0 0 3px rgba(244,239,234,.12)}
  .card.playing{border-color:var(--o);box-shadow:0 0 0 3px var(--osoft)}
  .card .no{position:absolute;left:18px;top:18px;z-index:6;width:24px;height:24px;border-radius:50%;background:rgba(15,13,12,.8);border:1px solid var(--line2);display:grid;place-items:center;font:800 11px var(--ui)}
  .card .pk{position:absolute;right:18px;top:18px;z-index:6;padding:3px 9px;border-radius:7px;background:var(--text);color:var(--ink);font:800 11px var(--ui);display:none}
  .card.picked .pk{display:block}
  .card .tag{position:absolute;right:8px;bottom:8px;z-index:6;padding:2px 8px;border-radius:6px;background:rgba(15,13,12,.85);color:var(--o2);font:700 10.5px var(--ui);border:1px solid rgba(255,140,60,.35)}
  .pbtn{position:absolute;left:8px;bottom:8px;z-index:6;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 11px 6px 9px;
    background:rgba(15,13,12,.82);color:#fff;font:800 11.5px var(--ui);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .pbtn:before{content:"";width:0;height:0;border-left:8px solid var(--o);border-top:5px solid transparent;border-bottom:5px solid transparent}
  .pbtn:hover{background:var(--o);color:var(--ink)} .pbtn:hover:before{border-left-color:var(--ink)}
  .thumb{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#0B0A09;margin-bottom:12px}
  .thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .thumb .ov{position:absolute;inset:0;overflow:hidden}
  .card h3{margin:0 4px 3px;font:800 15.5px var(--disp);letter-spacing:-.01em}
  .card p{margin:0 4px;color:var(--mut);font-size:12.5px;line-height:1.35}
  .cfoot{display:flex;gap:6px;margin:10px 4px 0}
  .cfoot button{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:5px 9px;font-weight:700;font-size:12px;color:var(--mut)}
  .cfoot button:hover{color:var(--text);border-color:var(--o)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
  .field label{font:700 12px var(--ui);color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
  .field input[type=text]{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;color:var(--text);font:700 15px var(--disp)}
  .field input:focus{outline:none;border-color:var(--o)}
  input[type=range]{accent-color:var(--o)}
  .box{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;margin:0 0 18px}
  .box h4{margin:0 0 8px;font:800 14px var(--disp)}
  .kw{display:flex;flex-wrap:wrap;gap:7px}
  .kw button{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;color:var(--mut)}
  .kw button.on{color:var(--ink);border-color:transparent}
  .meter{height:10px;border-radius:6px;background:var(--panel3);overflow:hidden;margin:8px 0 4px}
  .meter i{display:block;height:100%}
  .list{display:flex;flex-direction:column;gap:8px}
  .li{display:flex;align-items:center;gap:10px;color:var(--mut)}
  .li b{color:var(--text)}
  .ok{color:var(--ok)} .warn{color:var(--o2)}
  .drop{border:2px dashed var(--line2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--mut);padding:18px;cursor:pointer}
  .drop.hover{border-color:var(--o);color:var(--text);background:var(--osoft)}
  .drop b{color:var(--text);font:800 16px var(--disp)}
  .bigbtn{border:0;border-radius:14px;padding:14px 22px;font:900 16px var(--disp);background:var(--o);color:var(--ink)}
  .bigbtn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
  .bigbtn:disabled{opacity:.45;cursor:default}
  .log{font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--mut);white-space:pre-wrap;max-height:180px;overflow:auto}
  .player{width:min(100%,360px);aspect-ratio:9/16;border-radius:20px;background:#000;overflow:hidden;box-shadow:0 0 0 1px var(--line2)}
  .player video{width:100%;height:100%}
  .two{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:24px;align-items:start}
  /* bottom bar */
  .bottom{display:flex;align-items:center;gap:16px;padding:0 22px;border-top:1px solid var(--line);background:var(--panel)}
  .bottom .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-weight:700;font-size:13px}
  .bottom .mid .bar{width:160px;height:5px;border-radius:3px;background:var(--panel3);overflow:hidden}
  .bottom .mid .bar i{display:block;height:100%;background:var(--o)}
  .navbtn{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:11px 22px;font:800 14px var(--disp)}
  .navbtn.next{background:var(--o);border-color:var(--o);color:var(--ink);min-width:170px}
  .navbtn:disabled{opacity:.35;cursor:default}
  .toast{position:fixed;right:22px;top:72px;max-width:420px;background:var(--panel3);border:1px solid var(--line2);border-radius:14px;padding:12px 15px;font-size:13px;white-space:pre-wrap;display:none;z-index:50;box-shadow:0 16px 44px rgba(0,0,0,.5)}
  .toast.show{display:block}
  .empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r)}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
  .lctl{display:flex;flex-direction:column;align-items:center;gap:10px}
  /* narrow windows: the phone stays on screen as a strip on top (it used to be hidden, so card previews played where nobody could see them) */
  @media (max-width:900px){
    .body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .left{flex-direction:row;justify-content:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);gap:16px}
    .phone{height:min(300px,38vh);flex:none;border-radius:16px}
    .lctl{align-items:flex-start}
    .two{grid-template-columns:1fr}
    .sname{max-width:200px}
    .right{padding:18px 16px 30px}
    .top{gap:10px;padding:0 14px}
  }
  @media (max-width:560px){.projchip{display:none!important}.lctl .t{display:none}}

  /* ---- the 1080×1920 stage: graphics drawn at render size, scaled to the phone / card (same layout as mograph) ---- */
  .stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;pointer-events:none;font-family:"Inter Tight";color:#fff}
  .stage .bt{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.045em;line-height:.8;white-space:nowrap;text-transform:uppercase;
    filter:drop-shadow(0 10px 40px rgba(0,0,0,.35)) drop-shadow(0 0 50px var(--glow))}
  .stage .bt span{display:inline-block;padding:0 .01em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stage .bt.o span{background:none;-webkit-text-stroke:5px var(--ol)}
  .stage .bk{position:absolute;left:0;right:0;text-align:center;color:#fff;line-height:1;text-shadow:0 3px 10px rgba(0,0,0,.65),0 0 30px rgba(0,0,0,.35)}
  .stage .bk.big{font-weight:900;letter-spacing:-.025em;line-height:.95;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 36px rgba(0,0,0,.6)}
  .stage .lkw{position:absolute;left:64px;right:144px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .stage .lk{white-space:nowrap;text-shadow:0 0 2px rgba(0,0,0,.85),0 2px 5px rgba(0,0,0,.6),0 6px 26px rgba(0,0,0,.55)}
  .stage .lk.xl{font-weight:900;line-height:.86;letter-spacing:-.045em}
  .stage .lk.sc{font-weight:400;line-height:1;padding:0 8px}
  .stage .lk.sm{font-weight:700;line-height:1.02;font-size:40px}
  .stage .lk.tag{font-weight:800;font-size:46px;padding:10px 30px;border-radius:999px;text-shadow:none;margin-bottom:8px}
  .stage .tgw{position:absolute;left:64px;right:144px;display:flex;flex-direction:column;align-items:flex-start}
  .stage .tg{display:flex;align-items:center;gap:24px;padding:20px 34px 20px 20px;border-radius:30px;background:rgba(12,9,8,.84);border:2px solid var(--accA);
    box-shadow:0 18px 50px rgba(0,0,0,.45);max-width:872px}
  .stage .tg.np{padding:18px 34px}
  .stage .tg-ic{width:88px;height:88px;border-radius:22px;flex:none;display:grid;place-items:center}
  .stage .tg-ic svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .stage .tg-tx{display:flex;flex-direction:column;gap:4px;min-width:0}
  .stage .tg-k{font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
  .stage .tg-t{font-size:62px;font-weight:900;letter-spacing:-.03em;line-height:1.0;white-space:nowrap}
  .stage .tg.ty .tg-t{white-space:normal;max-width:800px}
  .stage .tg.ct .tg-t{font-size:104px;line-height:.95;letter-spacing:-.04em}
  .stage .tg.cm{background:#fff;border:none;border-radius:36px 36px 36px 10px;padding:24px 38px 24px 24px;align-items:flex-start;box-shadow:0 22px 60px rgba(0,0,0,.42)}
  .stage .tg.cm .tg-ic{width:84px;height:84px;border-radius:50%}
  .stage .tg.cm .tg-k{color:#6B6560;letter-spacing:0;text-transform:none;font-size:30px;font-weight:700}
  .stage .tg.cm .tg-t{color:#15110F;font-size:52px;font-weight:800;letter-spacing:-.02em;white-space:normal;max-width:690px;line-height:1.08}
  .stage .tg-m{display:flex;gap:26px;margin-top:8px;font-size:26px;font-weight:700;color:#8C837C}
  .stage .thw{position:absolute;left:64px;right:144px;bottom:470px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .stage .th-tag{display:inline-flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px 22px;border-radius:10px;background:#151311;border:2px solid var(--acc);
    color:#fff;font-size:34px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}

let LANG = "en"; try { LANG = localStorage.getItem("studioLang") || "en"; } catch (e) {}

/* ============================================================ state */
const STEPS = ["start", "colours", "fonts", "hook", "captions", "visuals", "extras", "watch"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tc = (x) => { x = Math.max(0, x || 0); return `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, "0")}`; };
const norm = (w) => (w || "").toLowerCase().replace(/[^\p{L}\p{N}']+/gu, "");
let forceVideo = false;
let CAT = null, PROJ = [], P = null, L = null, step = 0, sub = { visuals: "yours", extras: "elements" }, poll = null, samples = {}, SET = { name: "Studio" };
async function api(path, body) { const r = await fetch(path, body !== undefined ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}); return r.json(); }
function toast(m, ms = 3500) { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._t); if (ms) el._t = setTimeout(() => el.classList.remove("show"), ms); }
function busy(b, msg) { $("status").className = "status" + (b ? " busy" : ""); $("status").textContent = b ? (msg || t("saving")) : t("saved"); }
const pal = () => CAT.palettes.find((p) => p.id === L.palette) || CAT.palettes[0];
const pair = (id) => CAT.fonts.find((f) => f.id === (id || L.fonts)) || CAT.fonts[0];
const accent = () => L.accent || pal().accent;
const inkFor = (hex) => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return 0.299 * r + 0.587 * g + 0.114 * b > 120 ? "#1A0B04" : "#FFFFFF"; };
const mix = (a, b, p) => { const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16); const c = (s) => Math.round(((x >> s) & 255) * (1 - p) + ((y >> s) & 255) * p);
  return "#" + [16, 8, 0].map((s) => c(s).toString(16).padStart(2, "0")).join(""); };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const grad = (acc) => `linear-gradient(180deg,${mix(acc, "#FFFFFF", 0.38)} 0%,${acc} 100%)`;
const wt = (f, w) => (f.id === "punchy" ? 400 : w);
/* text width in a real font (so stage graphics auto-fit exactly like mograph's fontTools fit) */
const _cv = document.createElement("canvas").getContext("2d");
function tw(text, weight, px, family, track = 0) { _cv.font = `${weight} ${px}px "${family}"`; return _cv.measureText(text).width + text.length * track * px; }

/* ============================================================ boot */
async function boot() {
  [CAT, SET] = await Promise.all([api("/api/catalog"), api("/api/settings")]);
  paintName();
  PROJ = (await api("/api/projects")).sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
  // deep links: ?p=<project>&step=hook&sub=library&lang=tl (shareable, and lets demos/screenshots open any step)
  const q = new URLSearchParams(location.search);
  if (q.get("lang") && I18N[q.get("lang")]) { LANG = q.get("lang"); paintName(); }
  let want = q.get("p"); if (!want) try { want = localStorage.getItem("studioProj"); } catch (e) {}
  if (want && PROJ.some((p) => p.name === want)) await openProject(want, false);
  if (P && q.get("step")) { const s = q.get("step"), i = STEPS.includes(s) ? STEPS.indexOf(s) : +s; if (i >= 0 && i < STEPS.length) step = i; }
  if (q.get("sub")) sub[STEPS[step]] = q.get("sub");

  Promise.all(CAT.fonts.flatMap((f) => [document.fonts.load(`900 40px "${f.display}"`), document.fonts.load(`800 40px "${f.display}"`), document.fonts.load(`400 40px "${f.script}"`)]))
    .then(() => { render(); lastHookKey = ""; }).catch(() => {});
}
async function openProject(name, go = true) {

}
const prettyName = (p) => (p.src || p.name).replace(/\.(mov|mp4|m4v)$/i, "").replace(/^([0-9A-F]{8})-.*$/, "$1");

/* ---- the studio's own name (editable — it's the product name buyers see) */
function paintName() {
  const n = SET.name || "Studio"; $("sname").textContent = n; $("logoI").textContent = (n.trim()[0] || "S").toUpperCase();
  document.title = n; $("sname").title = t("rename"); $("pen").title = t("rename");
}
$("pen").onclick = () => { const el = $("sname"); el.contentEditable = "true"; el.focus(); document.getSelection().selectAllChildren(el); };

/* ============================================================ chrome */
function paintChrome() {
  document.querySelectorAll("#lang button").forEach((b) => b.classList.toggle("on", b.dataset.l === LANG));

  const done = new Set((L && L.done) || []);
  $("steps").innerHTML = STEPS.map((s, i) => `<button data-i="${i}" class="${i === step ? "on" : ""} ${done.has(s) ? "done" : ""}" ${!P && i > 0 ? "disabled" : ""}>

  $("stepOf").textContent = t("stepOf", step + 1, STEPS.length); $("stepBar").style.width = ((step + 1) / STEPS.length * 100) + "%";

  $("play").textContent = playing ? "❚❚ " + t("pause") : "▶ " + t("play");

}
$("lang").onclick = (e) => { const b = e.target.closest("button[data-l]"); if (!b) return; LANG = b.dataset.l; try { localStorage.setItem("studioLang", LANG); } catch (er) {} paintName(); paintChrome(); render(); };

$("next").onclick = async () => { if (!P) return; await save({ done: STEPS[step] }, true); if (step === STEPS.length - 1) return doRender(false); go(step + 1); };
function go(i) { stopDemo(); forceVideo = false; step = Math.max(0, Math.min(STEPS.length - 1, i)); $("main").scrollTop = 0; paintChrome(); render(); }
const stillStep = () => ["hook", "colours", "fonts"].includes(STEPS[step]);

let saveQ = Promise.resolve(); // saves go one after another, so quick clicks land in the order they were made
function save(partial, quiet) {
  if (!P) return Promise.resolve(); busy(true);
  const run = saveQ.then(() => api(`/api/project/${P.name}/look`, partial)).then((r) => {
    L = r; busy(false); paintChrome(); buildCaps(); if (!quiet) { render(); updatePreview(); }
  });
  saveQ = run.catch(() => busy(false));
  return run;
}

/* ============================================================ sound: the render's own sfx.py sounds, via Web Audio */
let AC = null; const BUF = {}; let live = [];
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); return AC; }
function buf(n) { if (!BUF[n]) BUF[n] = fetch(`/sfx/${n}.wav`).then((r) => r.arrayBuffer()).then((b) => ac().decodeAudioData(b)).catch(() => null); return BUF[n]; }
async function sfxAt(list, t0, token) {
  for (const [at, n] of list) {
    const b = await buf(n); if (!b || !demo || demo !== token) continue;
    const s = ac().createBufferSource(); s.buffer = b; s.connect(ac().destination);
    s.start(Math.max(ac().currentTime, t0 + at)); live.push(s);
  }
}
function stopSfx() { live.forEach((s) => { try { s.stop(); } catch (e) {} }); live = []; }
const sfxOn = () => !L || L.extras.motion.includes("sfx");

/* ============================================================ animator — mirrors mograph's GSAP moves with Web Animations */

  const fx = (el, kf, dur, delay, ease = EO) => A.push(el.animate(kf, { duration: dur, delay, easing: ease, fill: "both" }));
  root.querySelectorAll("[data-a],[data-out]").forEach((el) => {
    const d0 = (off + +(el.dataset.t || 0)) * 1000, d = +(el.dataset.d || 0) * 1000, a = el.dataset.a || "";

  keywords: { ov: (a, f) => `<div class="capd" data-a="capop" style="top:1150px;font-size:104px;font-family:'${f.display}';font-weight:${wt(f, 800)}">in just <span style="color:${a}">1 hour</span></div>`, main: true, noLayer: true },
  comment: { ov: (a, f) => hookParts("comment", "Paano mo na-edit to?", "@viewer").front, snd: [[0, "pop"]], t: .5 },
  counter: { ov: (a, f) => hookParts("counter", "2,487", "views in a week").front, snd: [[.02, "sw_air"], ...Array.from({ length: 16 }, (_, k) => [.3 + k * .075, "tick"]), [1.55, "ding"]], t: .5 },
  typing: { ov: (a, f) => hookParts("typing", "film once, post all week", "").front, snd: [[.02, "sw_air"], [.3, "type"]], t: .5 },
  script: { ov: (a, f) => `<div data-a="write" data-d="1.1" style="position:absolute;left:0;right:0;top:330px;text-align:center;font:400 150px '${f.script}';color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5)">post all week</div>`, snd: [[0, "swish"]], t: .5 },
  punch: { ov: (a) => `<div style="position:absolute;inset:180px 120px;border:5px dashed ${a};border-radius:30px"></div><div style="position:absolute;right:150px;top:110px;font:800 44px var(--ui);color:${a}">1.07×</div>`, punch: true },
  hookzoom: { ov: (a) => `<div style="position:absolute;inset:80px;border:5px solid ${rgba(a, .55)};border-radius:34px"></div><div style="position:absolute;inset:240px;border:5px dashed ${a};border-radius:30px"></div>`, hz: true },
  glass: { ov: (a, f) => `<div class="glass" data-a="big" data-t=".6" data-out="3.4"><div style="font:800 34px var(--ui);letter-spacing:.16em;color:${a}">◆ ISANG VIDEO</div><div style="font:900 92px/1 '${f.display}';margin-top:10px">Mas <span style="color:${a}">mabilis</span></div></div>`, snd: [[.6, "sw_deep"]], blur: [.6, 3.6] },
  sfx: { ov: (a) => [0.3, 1.3, 2.3].map((x, i) => `<div class="streak" data-a="streak" data-t="${x}" style="top:${560 + i * 260}px;background:linear-gradient(90deg,transparent,${a},transparent)"></div>`).join(""), snd: [[.3, "sw_whip"], [1.3, "sw_shimmer"], [2.3, "sw_deep"]] },
  riser: { ov: (a) => `<div style="position:absolute;left:150px;right:150px;bottom:620px;height:160px;display:flex;align-items:flex-end;gap:14px">${[16, 28, 40, 56, 76, 100, 128, 160].map((h, i) => `<i data-a="pop" data-t="${(i * .36).toFixed(2)}" style="flex:1;height:${h}px;background:${a};border-radius:6px;display:block"></i>`).join("")}</div>`, snd: [[0, "riser"], [3.0, "sw_deep"]], push: true },
};
function vExtras() {
  const seg = `<div class="seg"><button data-sub="elements" class="${sub.extras === "elements" ? "on" : ""}">${esc(t("elements"))}</button><button data-sub="motion" class="${sub.extras === "motion" ? "on" : ""}">${esc(t("motion"))}</button></div>`;
  const list = CAT.extras[sub.extras], on = new Set(L.extras[sub.extras]), img = frameUrl(midT()), acc = accent(), f = pair();
  const cards = list.map((x, i) => card({ n: i + 1, picked: on.has(x.id), img, ov: EXDEMO[x.id] ? stage(EXDEMO[x.id].ov(acc, f)) : "", title: x.name, note: x.note,
    tag: x.kind === "setting" ? t("onrender") : t("claude"), attrs: `data-ex="${x.id}"`, play: `ex:${x.id}` })).join("");
  return header("ex_k", "ex_h", "ex_l") + seg + howto() + `<div class="grid">${cards}</div>`;
}
function demoExtra(id) {
  const d = EXDEMO[id]; if (!d) return; const acc = accent(), f = pair(), from = talkTime(), off = d.t || 0;
  const o = { label: `${t("d_fx")} · ${(CAT.extras.elements.concat(CAT.extras.motion).find((x) => x.id === id) || {}).name || id}`, main: true, from, dur: 5,
    front: d.noLayer ? "" : d.ov(acc, f), off, sounds: (d.snd || []).map(([a, n]) => [a + off, n]), hideCaps: ["comment", "counter", "typing", "script", "glass"].includes(id) };
  if (id === "progress") o.front = `<div style="position:absolute;left:64px;right:64px;top:64px;height:8px;border-radius:4px;background:rgba(140,106,85,.55);overflow:hidden"><i data-a="fill" data-d="5" style="display:block;height:100%;width:0;background:${acc}"></i></div>`;
  if (d.punch) o.fx = ([v]) => { let k = 0; const iv = setInterval(() => { k++; v.style.transform = k % 2 ? "scale(1.07)" : ""; }, 1100); return () => clearInterval(iv); };
  if (d.hz) o.zoom = { kf: [{ transform: "scale(1.12)" }, { transform: "scale(1)" }, { transform: "scale(1)", offset: .45 }, { transform: "scale(1.08)" }], dur: 4200 };
  if (d.push) o.zoom = { kf: [{ transform: "scale(1)" }, { transform: "scale(1.08)" }], dur: 3000, ease: "cubic-bezier(.55,0,1,.45)" };
  if (d.blur) { o.keepFilter = true; o.fx = ([v]) => { const a = setTimeout(() => (v.style.filter = "blur(9px) brightness(.72) saturate(.8)"), d.blur[0] * 1000), b = setTimeout(() => (v.style.filter = ""), d.blur[1] * 1000); return () => { clearTimeout(a); clearTimeout(b); }; }; }
  if (!sfxOn() && id !== "sfx" && id !== "riser") o.sounds = [];
  startDemo(o);
}
/* ---- Watch */
function vWatch() {
  const pv = (P.previews || []).slice().reverse(), finals = (P.outputs || []).filter((o) => /_FINAL\.mp4$/.test(o));
  const latest = finals[0] && P.job && P.job.final ? finals[0] : pv[0] || finals[0];
  const f = pair(), look = `<div class="box"><h4>${esc(t("look_h"))}</h4><div class="list">
     <div class="li"><i style="width:14px;height:14px;border-radius:4px;background:${accent()};display:inline-block"></i><b>${esc(pal().name)}</b> ${esc(accent())}</div>
     <div class="li"><b style="font-family:'${f.display}'">${esc(f.name)}</b> · <span style="font-family:'${f.script}';font-size:18px;color:var(--text)">${esc(f.script)}</span></div>
     <div class="li"><b>${esc(t("steps")[3])}</b> ${esc((CAT.hooks.find((h) => h.id === L.hook.type) || {}).name || "")} · “${esc(L.hook.text)}”</div>
     <div class="li"><b>${esc(t("steps")[4])}</b> ${esc((CAT.captions.find((c) => c.id === L.caption.style) || {}).name || "")} · ${esc((CAT.positions.find((p) => p.id === L.caption.pos) || {}).name || "")}</div>
     <div class="li"><b>${esc(t("steps")[6])}</b> ${esc([...L.extras.elements, ...L.extras.motion].join(" · "))}</div>
     <div class="li warn">${esc(t("rebuild"))}</div></div></div>`;
  const job = P.job || {}, running = job.state === "running";
  const versions = pv.length || finals.length ? `<div class="seg" id="vers" style="flex-wrap:wrap">${[...finals, ...pv].map((o) => `<button data-out="${esc(o)}" class="${o === latest ? "on" : ""}">${esc(o.replace(P.name + "_", "").replace(".mp4", ""))}</button>`).join("")}</div>` : "";
  return header("w_k", "w_h", "w_l") + `<div class="two">
    <div><div class="player">${latest ? `<video id="outv" src="/out/${esc(latest)}" controls playsinline></video>` : `<div class="empty" style="height:100%;display:grid;place-items:center">${esc(t("none_yet"))}</div>`}</div>
      <div style="margin-top:12px">${versions}</div></div>
    <div><div class="row" style="margin-top:0">
        <button class="bigbtn" id="rPrev" ${running ? "disabled" : ""}>${esc(t("r_prev"))}<div style="font:600 12px var(--ui);opacity:.75">${esc(t("r_prev_s"))}</div></button>
        <button class="bigbtn sec" id="rFinal" ${running ? "disabled" : ""}>${esc(t("r_final"))}<div style="font:600 12px var(--ui);opacity:.75">${esc(t("r_final_s"))}</div></button></div>
      <div class="box" id="logBox" style="${running || job.log ? "" : "display:none"}"><h4>${esc(running ? t("rendering") : "Log")}</h4><div class="log" id="log">${esc(job.log || "")}</div></div>
      ${latest ? `<div class="row"><a class="tlink" href="/out/${esc(latest)}" download>${esc(t("dl_mp4"))}</a>${finals[0] ? `<a class="tlink" href="/out/${esc(P.name)}.srt" download>${esc(t("dl_srt"))}</a>` : ""}</div>` : ""}
      ${look}
      <div class="box"><h4>${esc(t("fixcuts"))}</h4><p class="lead" style="font-size:13px;margin:0 0 10px">${esc(t("fixcuts_s"))}</p><a class="tlink" href="/editor" target="_blank">${esc(t("fine"))}</a></div>
    </div></div>`;
}
async function doRender(final) {
  if (!P) return; stopDemo(); go(STEPS.indexOf("watch"));
  await api(`/api/project/${P.name}/render`, { final }); P.job = { state: "running", log: "", final }; render(); watch();
}
function watch() {
  clearInterval(poll); busy(true, t("rendering"));
  poll = setInterval(async () => {
    const q = await api(`/api/project/${P.name}`); const j = q.job || {};
    const lg = $("log"); if (lg) { lg.textContent = (j.log || "…").trim(); lg.scrollTop = 1e9; $("logBox").style.display = ""; }
    if (j.state !== "running") { clearInterval(poll); busy(false); P = q; L = await api(`/api/project/${P.name}/look`); setupPlayer(); if (STEPS[step] === "watch") render(); toast(j.state === "done" ? `✓ ${j.output || ""}` : "Render failed — see log", 5000); }
  }, 2500);
}

/* ============================================================ play a card (with sound) */
async function playCard(spec, cardEl) {
  if (!P) return; ac(); const [kind, id] = spec.split(/:(.*)/s);
  document.querySelectorAll(".card.playing").forEach((c) => c.classList.remove("playing"));
  if (kind === "hook") await demoHook(id);
  else if (kind === "cap") { startDemo({ label: `${t("d_cap")} · ${(CAT.captions.find((c) => c.id === id) || {}).name || id}`, main: true, from: talkTime(), dur: 6, capStyle: id, cleanup: () => buildCaps() }); }
  else if (kind === "ex") demoExtra(id);
  else if (kind === "scene") {
    const s = (P.scenes || []).find((x) => x.id === id); if (!s || s.at === null) return;
    const r = await api(`/api/project/${P.name}/clip?at=${s.at}&dur=${s.dur || 4}`);
    if (r.url) demoClip(r.url, `${t("d_render")} · ${s.label || s.id}`, (s.dur || 4)); else { toast(t("no_render")); startDemo({ label: s.label, main: true, from: Math.max(0, s.at - .3), dur: (s.dur || 4) + .6 }); }
  } else if (kind === "sample") {
    const r = await api(`/gfx/sampleclip/${id}`); if (r.url) demoClip(r.url, t("d_sample"), 8); else toast(t("no_render"));
  }
  if (cardEl && demo) cardEl.classList.add("playing");
}

/* ============================================================ events */
$("main").addEventListener("click", async (e) => {
  const pb = e.target.closest("[data-play]");
  if (pb) { e.stopPropagation(); return playCard(pb.dataset.play, pb.closest(".card")); }
  const tg = e.target.closest("[data-scenetoggle]");
  if (tg) {
    const s = P.scenes.find((x) => x.id === tg.dataset.scenetoggle); busy(true); stopDemo();
    const r = await api(`/api/project/${P.name}/review`, { kind: "scene", key: s.id, state: s.disabled ? "open" : "rejected" });
    P = r; L = await api(`/api/project/${P.name}/look`); busy(false); render(); return;
  }
  const el = e.target.closest("[data-proj],[data-pal],[data-font],[data-hook],[data-cap],[data-pos],[data-kw],[data-sub],[data-dens],[data-vis],[data-ex],[data-scene],[data-out],#rPrev,#rFinal,#drop");
  if (!el) return;
  const d = el.dataset;
  if (el.id === "drop") return $("file").click();
  if (el.id === "rPrev") return doRender(false);
  if (el.id === "rFinal") return doRender(true);
  if (d.proj) return openProject(d.proj, true);
  if (d.pal) { ac(); const p = CAT.palettes.find((x) => x.id === d.pal); await save({ palette: p.id, accent: p.accent }); return demoHook(); }
  if (d.font) { ac(); await save({ fonts: d.font }); return demoHook(); }
  if (d.hook) { ac(); await save({ hook: { type: d.hook, text: $("hookText").value, kicker: $("hookKick").value } }); if (d.hook !== "none") { const c = document.querySelector(`[data-hook="${d.hook}"]`); await demoHook(d.hook); if (c && demo) c.classList.add("playing"); } else stopDemo(); return; }
  if (d.cap) { ac(); await save({ caption: { style: d.cap, size: (CAT.captions.find((c) => c.id === d.cap) || {}).size || L.caption.size } }); buildCaps(); if (d.cap !== "none") playCard(`cap:${d.cap}`, document.querySelector(`[data-cap="${d.cap}"]`)); return; }
  if (d.pos) { await save({ caption: { pos: d.pos } }); return playCard(`cap:${L.caption.style}`); }
  if (d.kw) { const on = L.keywords.some((k) => norm(k) === norm(d.kw)); return save({ keywords: on ? L.keywords.filter((k) => norm(k) !== norm(d.kw)) : [...L.keywords, d.kw] }); }
  if (d.sub) { stopDemo(); sub[STEPS[step]] = d.sub; return render(); }
  if (d.dens) return save({ visuals: { density: d.dens, types: L.visuals.types } });
  if (d.vis) { ac(); const ty = new Set(L.visuals.types || []), adding = !ty.has(d.vis); adding ? ty.add(d.vis) : ty.delete(d.vis); await save({ visuals: { density: L.visuals.density, types: [...ty] } });
    const v = CAT.visuals.find((x) => x.id === d.vis); if (adding && v && v.sample) playCard(`sample:${v.sample}`, document.querySelector(`[data-vis="${d.vis}"]`)); return; }
  if (d.ex) { ac(); const kind = sub.extras, cur = new Set(L.extras[kind]), adding = !cur.has(d.ex); adding ? cur.add(d.ex) : cur.delete(d.ex); await save({ extras: { ...L.extras, [kind]: [...cur] } });
    if (adding) playCard(`ex:${d.ex}`, document.querySelector(`[data-ex="${d.ex}"]`)); else stopDemo(); return; }
  if (d.scene) return playCard(`scene:${d.scene}`, el);
  if (d.out) { const v = $("outv"); if (v) v.src = `/out/${d.out}`; document.querySelectorAll("#vers button").forEach((b) => b.classList.toggle("on", b === el)); }
});
$("main").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("card")) { e.preventDefault(); e.target.click(); } });
$("main").addEventListener("input", (e) => {
  if (e.target.id === "custom") { clearTimeout(e.target._t); const v = e.target.value; e.target._t = setTimeout(() => save({ palette: "custom", accent: v.toUpperCase() }), 250); }
  if (e.target.id === "capSize") { $("sizeV").textContent = e.target.value; L.caption.size = +e.target.value; clearTimeout(e.target._t); e.target._t = setTimeout(() => save({ caption: { size: +e.target.value } }, true), 300); }
  if (e.target.id === "hookText" || e.target.id === "hookKick") {
    L.hook.text = $("hookText").value; L.hook.kicker = $("hookKick").value;
    document.querySelectorAll("[data-hook]").forEach((c) => { const ov = c.querySelector(".ov"); if (ov) { ov.innerHTML = hookStill(c.dataset.hook, L.hook.text || "WATCH THIS", L.hook.kicker); fitStages(ov); } });
    clearTimeout(e.target._t); e.target._t = setTimeout(() => save({ hook: { type: L.hook.type, text: L.hook.text, kicker: L.hook.kicker } }, true), 500);
  }
});
/* hover: the card's graphic plays silently (fix: the overlay used to sit on top of the video and swallow the hover) */
let hoverCard = null;
function cardHover(c, on) {
  const v = c.querySelector(".thumb video"); if (v) { if (on && v.src) v.play().catch(() => {}); else v.pause(); }
  const ov = c.querySelector(".ov"); if (!ov) return;
  cancelAnims(ov._anims); ov._anims = on ? runAnims(ov) : null;
}
$("main").addEventListener("mouseover", (e) => { const c = e.target.closest(".card"); if (c === hoverCard) return; if (hoverCard) cardHover(hoverCard, false); hoverCard = c; if (c) cardHover(c, true); });
$("main").addEventListener("mouseleave", () => { if (hoverCard) cardHover(hoverCard, false); hoverCard = null; });
/* uploads */
function sendFile(file) {
  const st = $("upst"); const xhr = new XMLHttpRequest();
  xhr.open("POST", `/api/upload?name=${encodeURIComponent(file.name)}`);
  xhr.upload.onprogress = (ev) => { if (st) st.textContent = `${t("uploading")} ${Math.round(ev.loaded / ev.total * 100)}%`; };
  xhr.onload = () => { const r = JSON.parse(xhr.responseText); if ($("upst")) $("upst").textContent = t("transcribing"); waitImport(r.name); };
  xhr.send(file);
}
function waitImport(name) {
  const tick = setInterval(async () => { const im = await api("/api/imports"); const j = im[name]; if (!j || j.state === "running") return; clearInterval(tick);
    if (j.state === "done") { PROJ = (await api("/api/projects")).sort((a, b) => (b.mtime || 0) - (a.mtime || 0)); toast(`✓ ${name} — ${t("ready")}`); render(); } else toast("Import failed:\n" + j.log, 0); }, 4000);
}
$("file").onchange = (e) => { const f = e.target.files[0]; if (f) sendFile(f); e.target.value = ""; };
document.addEventListener("dragover", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("hover"); } });
document.addEventListener("dragleave", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("hover"); });
document.addEventListener("drop", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("hover"); const f = e.dataTransfer.files[0]; if (f) sendFile(f); });
document.addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT" || e.target.isContentEditable) return; if (e.key === " " && !(e.target.classList && e.target.classList.contains("card"))) { e.preventDefault(); $("play").click(); } if (e.key === "Escape") stopDemo(); if (e.key === "ArrowRight" && e.metaKey) $("next").click(); if (e.key === "ArrowLeft" && e.metaKey) $("back").click(); });
window.addEventListener("DOMContentLoaded", boot);
</script>
